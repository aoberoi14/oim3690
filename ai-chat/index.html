<main>
  <h1>AI Chat</h1>
  <p>A small chat page calling the OpenAI Responses API directly from the browser using the class key. This only works when <code>config.js</code> is present locally, it is never pushed to GitHub.</p>

  <div id="chatLog"></div>

  <form id="chatForm">
    <label for="chatInput">Message</label>
    <input type="text" id="chatInput" name="chatInput" placeholder="Ask something..." required>
    <button type="submit">Send</button>
  </form>
