<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      background: #f4f4f4;
      color: #1a1a1a;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: #555; margin-bottom: 2rem; }
    .row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    label {
      width: 120px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input[type="number"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
    }
    .hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>Temperature Converter</h1>
  <p>Type in either field to convert instantly.</p>

  <div class="row">
    <label for="celsius">Celsius (°C)</label>
    <input type="number" id="celsius" placeholder="e.g. 100">
  </div>

  <div class="row">
    <label for="fahrenheit">Fahrenheit (°F)</label>
    <input type="number" id="fahrenheit" placeholder="e.g. 212">
  </div>

  <p class="hint">Formula: °F = (°C × 9/5) + 32</p>

  <script>
    const celsiusInput = document.getElementById('celsius');
    const fahrenheitInput = document.getElementById('fahrenheit');

    celsiusInput.addEventListener('input', function() {
      const c = parseFloat(celsiusInput.value);
      if (!isNaN(c)) {
        fahrenheitInput.value = ((c * 9 / 5) + 32).toFixed(2);
      } else {
        fahrenheitInput.value = '';
      }
    });

    fahrenheitInput.addEventListener('input', function() {
      const f = Number(fahrenheitInput.value);
      if (!isNaN(f) && fahrenheitInput.value !== '') {
        celsiusInput.value = ((f - 32) * 5 / 9).toFixed(2);
      } else {
        celsiusInput.value = '';
      }
    });
  </script>

</body>
</html>
