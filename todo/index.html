<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      background: #f4f4f4;
      color: #1a1a1a;
    }
    h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      background: #0070f3;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.5rem;
    }
    li.done span {
      text-decoration: line-through;
      color: #999;
    }
    li span { flex: 1; font-size: 1rem; }
    .delete-btn {
      background: none;
      color: #aaa;
      font-size: 1.1rem;
      padding: 0;
      line-height: 1;
    }
    .delete-btn:hover { color: #e00; }
    .summary {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    #clearBtn {
      margin-top: 1rem;
      background: #eee;
      color: #333;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
    }
  </style>
</head>
<body>

  <h1>To-Do</h1>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a task..." autocomplete="off">
    <button id="addBtn">Add</button>
  </div>

  <ul id="taskList"></ul>

  <p class="summary" id="summary"></p>
  <button id="clearBtn">Clear completed</button>

  <script src="script.js"></script>

</body>
</html>
