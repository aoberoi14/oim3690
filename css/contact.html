<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Adityavardhan Oberoi</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about-me.html">About</a>
            <a href="hello.html">Hello</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Get in Touch</h2>
            <p>Fill out the form below and I will get back to you.</p>

            <form action="https://oim.zhili.dev/echo/view" method="get">

                <div class="card">
                    <label for="name">Full Name</label><br>
                    <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your full name">
                </div>

                <div class="card">
                    <label for="email">Email Address</label><br>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                </div>

                <div class="card">
                    <label for="subject">Subject</label><br>
                    <input type="text" id="subject" name="subject" required placeholder="What is this about?">
                </div>

                <div class="card">
                    <label for="topic">Topic</label><br>
                    <select id="topic" name="topic">
                        <option value="">Select a topic</option>
                        <option value="entrepreneurship">Entrepreneurship</option>
                        <option value="film">Film Production</option>
                        <option value="internship">Internship</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="card">
                    <label for="message">Message</label><br>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
                </div>

                <div class="card">
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        Subscribe to updates
                    </label>
                </div>

                <button type="submit" class="highlight">Send Message</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Adityavardhan Oberoi &middot; Babson College</p>
    </footer>
</body>
</html>
