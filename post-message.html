<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Message — OIM3690</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="playlist.html">Playlist</a>
    <a href="fetch-fun.html">Fetch Fun</a>
    <a href="post-message.html">Post Message</a>
    <a href="data-app.html">Data App</a>
  </nav>
</header>

<main>
  <h1>Post a Message</h1>
  <p>Sends a message to the class API at <code>https://oim.zhili.dev/message</code> with an <code>X-Token</code> header identifying me.</p>

  <form id="messageForm">
    <label for="messageInput">Your message</label>
    <input type="text" id="messageInput" name="messageInput" placeholder="Say something..." required>
    <button type="submit">Send</button>
  </form>

  <p id="status" role="status"></p>
</main>

<script>
  const MY_TOKEN = "AdityavardhanAdityavardhan"; // your first name, twice

  async function postMessage(text) {
    const res = await fetch("https://oim.zhili.dev/message", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Token": MY_TOKEN,
      },
      body: JSON.stringify({ message: text }),
    });

    if (!res.ok) {
      throw new Error(`Request failed with status ${res.status}`);
    }

    return res.json();
  }

  // AI-added part: wire the form up so any message can be sent,
  // not just a hard-coded one, and show what the server actually sent back.
  document.getElementById("messageForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("messageInput");
    const statusEl = document.getElementById("status");
    const text = input.value.trim();
    if (!text) return;

    statusEl.textContent = "Sending...";
    try {
      const data = await postMessage(text);
      statusEl.textContent = `Posted! Server said: ${JSON.stringify(data)}`;
      input.value = "";
    } catch (err) {
      statusEl.textContent = "Something went wrong sending that message. Try again.";
      console.error(err);
    }
  });
</script>

</body>
</html>
